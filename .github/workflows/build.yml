name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One disk image for both Apple Silicon and Intel Macs
          - platform: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run bump -- --check
      - run: npm run typecheck
      - run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - name: Check the Mac app runs on both chip types and is signed
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Tonefield.app
          lipo "$app"/Contents/MacOS/* -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: tonefield-${{ runner.os }}
          path: src-tauri/target/${{ runner.os == 'macOS' && 'universal-apple-darwin/' || '' }}release/bundle/

  arch:
    # Builds packaging/arch/PKGBUILD the way an Arch/CachyOS user would
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo

      - uses: actions/checkout@v4

      - name: makepkg
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg -s --noconfirm

      - name: Install and check the package
        run: |
          pacman -U --noconfirm packaging/arch/tonefield-*.pkg.tar.zst
          pacman -Ql tonefield
          if ldd /usr/bin/tonefield | grep 'not found'; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: tonefield-arch
          path: packaging/arch/tonefield-*.pkg.tar.zst

  release:
    # Merging a version bump into main (npm run bump <version>) publishes the
    # builds above as a GitHub release, which the app's Update button offers to
    # older copies. Pull requests only list what would be published.
    needs: [build, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the version
        id: version
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists != 'true'
        with:
          path: artifacts

      - name: Publish the release
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.dmg artifacts/**/*.deb artifacts/**/*.AppImage artifacts/**/*-setup.exe artifacts/**/*.pkg.tar.zst)
          printf 'Release file: %s\n' "${files[@]}"
          # One of each kind the app looks for, or the Update button can't help someone
          for kind in .dmg .deb .AppImage -setup.exe .pkg.tar.zst; do
            printf '%s\n' "${files[@]}" | grep -q -- "$kind\$" || { echo "No $kind file was built"; exit 1; }
          done
          if [ "$PUBLISH" = true ]; then
            gh release create "$TAG" "${files[@]}" --title "Tonefield ${TAG#v}" --generate-notes --target "$GITHUB_SHA"
          else
            echo "Not on main, so $TAG isn't published"
          fi
